# Bundle patch layer: the row mounts this package's main entry as the Host half
# (the key-pool store, the rotation that follows a rejected key, the self-check
# and the balance lookups), and the `dsh.client` declaration makes the web app
# load ./client/client.js as the browser half, which is where the header button
# and its key editor live.
